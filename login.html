<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18221e">
  <title>Finexus | Log in</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .login-page { width: min(100%, 480px); }
    .login-card { padding: 34px; border: 1px solid rgba(255,255,255,.7); border-radius: 14px; background: rgba(255,255,255,.72); backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%); box-shadow: 0 24px 70px rgba(24,34,30,.2), inset 0 1px 0 rgba(255,255,255,.7); animation: auth-float 5s ease-in-out infinite; }
    .login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 31px; }
    .login-brand-mark { display: grid; place-items: center; position: relative; width: 36px; height: 36px; border-radius: 10px; color: var(--lime); background: var(--ink); font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; }
    .login-brand-mark::after { content: '↗'; position: absolute; right: 3px; bottom: 1px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 9px; }
    .login-brand-name { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; }
    .login-page h1 { font-family: 'Space Grotesk', sans-serif; font-size: 29px; letter-spacing: -.9px; }
    .login-intro { color: var(--muted); font-size: 12px; line-height: 1.55; margin-top: 8px; }
    .login-form { display: grid; gap: 14px; margin-top: 26px; }
    .login-page label { display: grid; gap: 7px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .login-page input { width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fbfcfa; outline: none; }
    .login-page input:focus { border-color: #9cbd48; box-shadow: 0 0 0 3px rgba(201,232,106,.25); }
    .login-page button { width: 100%; margin-top: 3px; }
    .register-button { display: block; width: 100%; margin-top: 10px; padding: 11px 0; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: transparent; text-align: center; font-size: 12px; font-weight: 700; text-decoration: none; }
    .register-button:hover { border-color: #9cbd48; background: #f4f8ed; }
    .login-error { display: none; padding: 10px 12px; border-radius: 7px; color: #a94436; background: #fce8e3; font-size: 11px; }
    .login-error.show { display: block; }
    .login-hint { color: var(--muted); text-align: center; font-size: 10px; margin-top: 16px; }
    @keyframes auth-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  </style>
</head>
<body>
  <main class="login-page"><section class="login-card"><div class="login-brand"><div class="login-brand-mark">F</div><div class="login-brand-name">Finexus</div></div><h1>Welcome back.</h1><p class="login-intro">Log in with your Gmail address or unique user name.</p><form class="login-form" id="loginForm"><label>GMAIL OR USER NAME<input id="loginEmail" type="text" required placeholder="e.g. priya@gmail.com or Priya Sharma"></label><div class="login-error" id="loginError">That Gmail address or user name does not match an account on this device.</div><button class="primary-button" type="submit">Log in to Finexus</button></form><a class="register-button" href="signup.html">Register a new account</a><div class="login-hint">Your account is stored securely on this device.</div></section></main>
  <script>
    const user = JSON.parse(localStorage.getItem('finexusUser') || '{}');
    const users = JSON.parse(localStorage.getItem('finexusUsers') || '[]');
    const accounts = users.length ? users : (user.email ? [user] : []);
    document.getElementById('loginForm').addEventListener('submit', event => { event.preventDefault(); const entered = document.getElementById('loginEmail').value.trim().toLowerCase(); const match = accounts.find(account => String(account.email).trim().toLowerCase() === entered || String(account.name).trim().toLowerCase() === entered); if (!match) { document.getElementById('loginError').classList.add('show'); return; } localStorage.setItem('finexusUser', JSON.stringify(match)); localStorage.setItem('finexusLoggedIn', 'true'); window.location.href = 'index.html'; });
  </script>
</body>
</html>
